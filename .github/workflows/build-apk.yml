name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk FuelLog-v${{ steps.v.outputs.version }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuelLog-v${{ steps.v.outputs.version }}
          path: FuelLog-v${{ steps.v.outputs.version }}.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}-b${{ github.run_number }}
          name: Fuel Log v${{ steps.v.outputs.version }} (build ${{ github.run_number }})
          body: Download the APK below and open it on your phone to install or update.
          files: FuelLog-v${{ steps.v.outputs.version }}.apk
          make_latest: true
